# ------------------------------------------------------------
#  RespawnBlocks - main configuration
#  Messages, prefix and GUI texts live in messages.yml
#  Respawn blocks and their times live in blocks.yml (editable in /rb gui)
#  Respawn regions live in regions.yml (editable in /rb gui)
# ------------------------------------------------------------

# Master switch. When false, blocks in respawn regions break normally.
enabled: true

# Block that replaces a mined block until it respawns.
# A block in blocks.yml can override this with its own "placeholder".
default-placeholder: BEDROCK

# Default respawn time (seconds) for blocks added without a time.
default-respawn-time: 60

# What happens with the drops of a respawn block:
#   NATURAL   - normal vanilla drops on the ground (fortune / silk touch work)
#   INVENTORY - normal vanilla drops, put straight into the player's inventory
#   BLOCK     - the block itself goes into the inventory (classic MineIsland behaviour)
# A block in blocks.yml can override this with its own "drop-mode".
drop-mode: INVENTORY

# Cancel breaking blocks in a respawn region that are NOT respawn blocks.
# Players with respawnblocks.bypass (or in creative mode) can still break them.
block-other-breaks: true

# Allow breaking respawn blocks even when another plugin (for example WorldGuard
# with "build deny") cancelled the break. Handy when your mine region is protected.
# Tip: with WorldGuard you can also set the flag "block-break allow" on the region.
override-protection: true

# Ignore players in creative mode (they break blocks normally, nothing respawns).
ignore-creative: true

# Respawn checks run every X ticks (20 ticks = 1 second).
check-interval-ticks: 20

# Pending respawns are written to data.yml every X minutes, so a crash doesn't
# leave placeholders behind forever. They are also saved on shutdown.
autosave-minutes: 1

# On shutdown, instantly respawn every placeholder that is in a loaded chunk.
# Placeholders in unloaded chunks are always saved and respawned later,
# as soon as their chunk loads again.
respawn-loaded-on-shutdown: true

# Effect played when a block respawns. Set sound to NONE to disable.
# Use a Bukkit sound name (BLOCK_STONE_PLACE) or a sound key (block.stone.place).
respawn-effect:
  sound: BLOCK_STONE_PLACE
  volume: 0.6
  pitch: 1.0
  particles: true
